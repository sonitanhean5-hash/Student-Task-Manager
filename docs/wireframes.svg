<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <style>
    .f{fill:#fff;stroke:#1b2333;stroke-width:1.5}
    .b{fill:#e9edf3;stroke:#8791a3}
    .h{fill:#1f4e79}
    .t{fill:#1b2333}
    .m{fill:#5b6475;font-size:11px}
    .w{fill:#fff}
    .ttl{font-size:15px;font-weight:700;fill:#1b2333}
  </style>
  <text x="20" y="24" class="ttl">M1 wireframes: Student Task Management System (Vue prototype)</text>

  <!-- 1 Dashboard -->
  <g transform="translate(20,40)">
    <rect class="f" width="490" height="330"/><rect class="h" width="490" height="30"/>
    <text x="10" y="20" class="w">Student Tasks</text><text x="300" y="20" class="w">Dashboard  All tasks  [New task]</text>
    <text x="14" y="56" class="ttl">1. Dashboard  /</text>
    <text x="14" y="82" class="t">Progress: 2 of 6 tasks completed</text>
    <rect class="b" x="14" y="90" width="460" height="10" rx="5"/><rect class="h" x="14" y="90" width="150" height="10" rx="5"/>
    <text x="14" y="130" class="t">All tasks 6     Pending 4     Completed 2</text>
    <text x="14" y="160" class="t" font-weight="700">Due next</text>
    <rect class="b" x="14" y="168" width="460" height="28"/><text x="22" y="187" class="t">Read chapter 6   OS   Due 12 Nov   Overdue</text>
    <rect class="b" x="14" y="200" width="460" height="28"/><text x="22" y="219" class="t">Lab 3 report   OS   Due 17 Nov   Pending</text>
    <rect class="b" x="14" y="232" width="460" height="28"/><text x="22" y="251" class="t">Spring Boot shop lab   SE   Due 20 Nov   Pending</text>
    <text x="14" y="290" class="m">States: loading spinner / error + Try again / empty + Add a task</text>
  </g>

  <!-- 2 List -->
  <g transform="translate(530,40)">
    <rect class="f" width="490" height="330"/><rect class="h" width="490" height="30"/>
    <text x="10" y="20" class="w">Student Tasks</text><text x="300" y="20" class="w">Dashboard  All tasks  [New task]</text>
    <text x="14" y="56" class="ttl">2. Task list  /tasks</text>
    <rect class="b" x="14" y="68" width="300" height="26"/><text x="22" y="86" class="m">Search by title</text>
    <rect class="b" x="326" y="68" width="148" height="26"/><text x="334" y="86" class="m">Status: All v</text>
    <rect class="b" x="14" y="106" width="460" height="30"/><text x="22" y="126" class="t">Lab 3 report   OS   Due 17 Nov   Pending   [Mark completed]</text>
    <rect class="b" x="14" y="140" width="460" height="30"/><text x="22" y="160" class="t">Spring Boot shop lab   SE   Due 20 Nov   Pending   [Mark completed]</text>
    <rect class="b" x="14" y="174" width="460" height="30"/><text x="22" y="194" class="t">Class activity 1   OS   Due 13 Nov   Completed</text>
    <text x="14" y="240" class="m">Click a title: detail page. Search and status filter are kept when coming back.</text>
    <text x="14" y="258" class="m">States: loading / error / no tasks yet / no matching tasks + Clear filters</text>
  </g>

  <!-- 3 Detail -->
  <g transform="translate(20,390)">
    <rect class="f" width="490" height="340"/><rect class="h" width="490" height="30"/>
    <text x="10" y="20" class="w">Student Tasks</text><text x="300" y="20" class="w">Dashboard  All tasks  [New task]</text>
    <text x="14" y="56" class="ttl">3. Task detail  /tasks/:id</text>
    <text x="14" y="80" class="m">Back to all tasks</text>
    <text x="14" y="106" class="t" font-weight="700" font-size="16">Lab 3 report: process scheduling      [Pending]</text>
    <rect class="b" x="14" y="118" width="460" height="120"/>
    <text x="24" y="140" class="t">Subject: Operating Systems</text>
    <text x="24" y="162" class="t">Due date: 17 Nov 2026</text>
    <text x="24" y="184" class="t">Created: 9 Nov 2026, 08:30</text>
    <text x="24" y="206" class="t">Description: Write up the round-robin results...</text>
    <rect class="h" x="14" y="258" width="120" height="28"/><text x="24" y="277" class="w">Mark completed</text>
    <rect class="b" x="144" y="258" width="80" height="28"/><text x="156" y="277" class="t">Edit task</text>
    <rect class="b" x="234" y="258" width="100" height="28" stroke="#a8231b"/><text x="244" y="277" class="t">Delete task</text>
    <text x="14" y="312" class="m">Delete asks: Delete this task? [Yes, delete] [Keep task]</text>
  </g>

  <!-- 4 Form -->
  <g transform="translate(530,390)">
    <rect class="f" width="490" height="340"/><rect class="h" width="490" height="30"/>
    <text x="10" y="20" class="w">Student Tasks</text><text x="300" y="20" class="w">Dashboard  All tasks  [New task]</text>
    <text x="14" y="56" class="ttl">4. New / edit task  /tasks/new, /tasks/:id/edit</text>
    <text x="14" y="82" class="t">Title</text><rect class="b" x="14" y="88" width="320" height="24"/>
    <text x="14" y="134" class="t">Subject</text><rect class="b" x="14" y="140" width="320" height="24"/>
    <text x="14" y="186" class="t">Due date</text><rect class="b" x="14" y="192" width="160" height="24"/>
    <text x="14" y="238" class="t">Description (optional)</text><rect class="b" x="14" y="244" width="320" height="44"/>
    <rect class="h" x="14" y="300" width="110" height="28"/><text x="24" y="319" class="w">Create task</text>
    <rect class="b" x="134" y="300" width="70" height="28"/><text x="146" y="319" class="t">Cancel</text>
    <text x="350" y="104" class="m" fill="#a8231b">Error text under the field:</text>
    <text x="350" y="120" class="m" fill="#a8231b">Use at least 3 characters.</text>
    <text x="350" y="206" class="m" fill="#a8231b">The due date cannot be in the past.</text>
  </g>
</svg>
